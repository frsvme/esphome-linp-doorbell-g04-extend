esphome:
  name: doorbell-mi-extend
  friendly_name: "doorbell-mi-extend"

esp32:
  board: esp32doit-devkit-v1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: y
    advanced:
      ignore_efuse_mac_crc: True
      ignore_efuse_custom_mac: True

logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: "****************="

# Custom services to control the chime chip.
  actions:
    - action: play_tune
      variables:
        tune: int
        volume: int
        mode: int
      then:
        - remote_transmitter.transmit_szy8039b:
            tune: !lambda 'return tune;'
            volume: !lambda 'return volume;'
            mode: !lambda 'return mode;'

    - action: stop_playing
      then:
        - remote_transmitter.transmit_szy8039b:
            command: STOP

    - action: set_tune
      variables:
        tune: int
      then:
        - number.set:
            id: tune_slider
            value: !lambda 'return tune;'

    - action: set_volume
      variables:
        volume: int
      then:
        - number.set:
            id: volume_slider
            value: !lambda 'return volume;'

    - action: set_mode
      variables:
        mode: int
      then:
        - if:
            condition:
              lambda: 'return mode == 3;'
            then:
              - switch.turn_on: mute_switch
            else:
              - switch.turn_off: mute_switch

    - action: set_mute
      variables:
        mute: bool
      then:
        - if:
            condition:
              lambda: 'return mute;'
            then:
              - switch.turn_on: mute_switch
            else:
              - switch.turn_off: mute_switch

ota:
  - platform: esphome
    password: "****************"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Doorbell-MI-Ext Fallback Hotspot"
    password: "12345678"

captive_portal:

# Built-in web interface with login/password.
web_server:
  port: 80
  version: 3
  auth:
    type: digest
    username: admin
    password: admin
  ota: false

  sorting_groups:
    - id: doorbell_control
      name: "Doorbell control"
      sorting_weight: 10

    - id: doorbell_sensors
      name: "Doorbell sensors"
      sorting_weight: 20

external_components:
  - source:
      type: git
      url: https://github.com/frsvme/esphome-linp-doorbell-g04-extend
    components: [ linptech_g6l ]

linptech_g6l:

remote_receiver:
  pin: GPIO26
  filter: 20us
  idle: 900us
  tolerance: 33%

  on_linptech_g6l:
    - lambda: |-
        uint32_t addr = (uint32_t) x.address;

        char addr_str[16];
        snprintf(addr_str, sizeof(addr_str), "0x%06" PRIx32, addr);
        id(last_button_address).publish_state(addr_str);

        // Learn mode: bind the next free doorbell slot.
        if (id(learn_active)) {
          if (addr == id(bell_address_a) ||
              addr == id(bell_address_b) ||
              addr == id(bell_address_c) ||
              addr == id(bell_address_d) ||
              addr == id(bell_address_e)) {
            ESP_LOGW("doorbell", "Button %s is already bound", addr_str);
            id(bound_buttons_count).publish_state(
              (id(bell_address_a) != 0) +
              (id(bell_address_b) != 0) +
              (id(bell_address_c) != 0) +
              (id(bell_address_d) != 0) +
              (id(bell_address_e) != 0)
            );
            id(learn_active) = false;
            return;
          }

          if (id(bell_address_a) == 0) {
            id(bell_address_a) = addr;
            ESP_LOGI("doorbell", "Added Doorbell A: %s", addr_str);
          } else if (id(bell_address_b) == 0) {
            id(bell_address_b) = addr;
            ESP_LOGI("doorbell", "Added Doorbell B: %s", addr_str);
          } else if (id(bell_address_c) == 0) {
            id(bell_address_c) = addr;
            ESP_LOGI("doorbell", "Added Doorbell C: %s", addr_str);
          } else if (id(bell_address_d) == 0) {
            id(bell_address_d) = addr;
            ESP_LOGI("doorbell", "Added Doorbell D: %s", addr_str);
          } else if (id(bell_address_e) == 0) {
            id(bell_address_e) = addr;
            ESP_LOGI("doorbell", "Added Doorbell E: %s", addr_str);
          } else {
            ESP_LOGW("doorbell", "No free doorbell slot");
            id(bound_buttons_count).publish_state(
              (id(bell_address_a) != 0) +
              (id(bell_address_b) != 0) +
              (id(bell_address_c) != 0) +
              (id(bell_address_d) != 0) +
              (id(bell_address_e) != 0)
            );
            id(learn_active) = false;
            return;
          }

          int count = 0;
          if (id(bell_address_a) != 0) count++;
          if (id(bell_address_b) != 0) count++;
          if (id(bell_address_c) != 0) count++;
          if (id(bell_address_d) != 0) count++;
          if (id(bell_address_e) != 0) count++;
    
          id(bound_buttons_count).publish_state(count);
          id(learn_active) = false;
          return;
        }

        // Normal mode: find which bound button was pressed.
        if (id(bell_address_a) != 0 && addr == id(bell_address_a)) {
          ESP_LOGI("doorbell", "Doorbell A pressed: %s", addr_str);
          id(doorbell_a).publish_state(true);
          id(reset_doorbell_a).execute();
          id(doorbell_pressed).execute(1);
        } else if (id(bell_address_b) != 0 && addr == id(bell_address_b)) {
          ESP_LOGI("doorbell", "Doorbell B pressed: %s", addr_str);
          id(doorbell_b).publish_state(true);
          id(reset_doorbell_b).execute();
          id(doorbell_pressed).execute(2);
        } else if (id(bell_address_c) != 0 && addr == id(bell_address_c)) {
          ESP_LOGI("doorbell", "Doorbell C pressed: %s", addr_str);
          id(doorbell_c).publish_state(true);
          id(reset_doorbell_c).execute();
          id(doorbell_pressed).execute(3);
        } else if (id(bell_address_d) != 0 && addr == id(bell_address_d)) {
          ESP_LOGI("doorbell", "Doorbell D pressed: %s", addr_str);
          id(doorbell_d).publish_state(true);
          id(reset_doorbell_d).execute();
          id(doorbell_pressed).execute(4);
        } else if (id(bell_address_e) != 0 && addr == id(bell_address_e)) {
          ESP_LOGI("doorbell", "Doorbell E pressed: %s", addr_str);
          id(doorbell_e).publish_state(true);
          id(reset_doorbell_e).execute();
          id(doorbell_pressed).execute(5);
        } else {
          ESP_LOGI("doorbell", "Unknown doorbell button: %s", addr_str);
        }

remote_transmitter:
  pin: GPIO15
  carrier_duty_percent: 100%
  non_blocking: true

output:
  - id: blue_led
    platform: gpio
    pin: GPIO4

  - id: orange_led
    platform: gpio
    pin: GPIO13

light:
  - platform: binary
    name: "Light Blue"
    output: blue_led
    id: blue_light
    effects:
      - strobe:
          name: blink
          colors:
            - state: true
              duration: 333ms
            - state: false
              duration: 333ms
    web_server:
      sorting_group_id: doorbell_sensors
      sorting_weight: 30

  - platform: binary
    name: "Light Orange"
    output: orange_led
    id: orange_light
    web_server:
      sorting_group_id: doorbell_sensors
      sorting_weight: 40

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO36
      inverted: true
    name: "Button left"
    on_press:
      - light.toggle: blue_light
    web_server:
      sorting_group_id: doorbell_sensors
      sorting_weight: 10

  - platform: gpio
    pin:
      number: GPIO39
      inverted: true
    name: "Button right"
    on_press:
      - if:
          condition:
            lambda: 'return id(mute_switch).state;'
          then:
            - switch.turn_off: mute_switch
            - remote_transmitter.transmit_szy8039b:
                tune: !lambda 'return (int) id(tune_slider).state;'
                volume: !lambda 'return (int) id(volume_slider).state;'
                mode: 1
            - logger.log: "Mute OFF (button)"
          else:
            - switch.turn_on: mute_switch
            - logger.log: "Mute ON (button)"
    web_server:
      sorting_group_id: doorbell_sensors
      sorting_weight: 20

  - platform: template
    name: "Doorbell A"
    id: doorbell_a
    web_server:
      sorting_group_id: doorbell_sensors
      sorting_weight: 50

  - platform: template
    name: "Doorbell B"
    id: doorbell_b
    web_server:
      sorting_group_id: doorbell_sensors
      sorting_weight: 60

  - platform: template
    name: "Doorbell C"
    id: doorbell_c
    web_server:
      sorting_group_id: doorbell_sensors
      sorting_weight: 70

  - platform: template
    name: "Doorbell D"
    id: doorbell_d
    web_server:
      sorting_group_id: doorbell_sensors
      sorting_weight: 80

  - platform: template
    name: "Doorbell E"
    id: doorbell_e
    web_server:
      sorting_group_id: doorbell_sensors
      sorting_weight: 90

number:
  - platform: template
    name: "Tune (Melody)"
    id: tune_slider
    min_value: 1
    max_value: 40
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 1
    web_server:
      sorting_group_id: doorbell_control
      sorting_weight: 10

  - platform: template
    name: "Volume"
    id: volume_slider
    min_value: 1
    max_value: 8
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 1
    web_server:
      sorting_group_id: doorbell_control
      sorting_weight: 20

button:
  - platform: restart
    name: "Doorbell Restart (for save settings)"
    web_server:
      sorting_group_id: doorbell_control
      sorting_weight: 70

  - platform: template
    name: "Play Doorbell (test)"
    id: play_doorbell
    on_press:
      - remote_transmitter.transmit_szy8039b:
          tune: !lambda 'return (int) id(tune_slider).state;'
          volume: !lambda 'return (int) id(volume_slider).state;'
          mode: !lambda 'return id(mute_switch).state ? 3 : 1;'
      - logger.log: "Virtual doorbell pressed"
    web_server:
      sorting_group_id: doorbell_control
      sorting_weight: 30

  - platform: template
    name: "Add doorbell button"
    id: add_doorbell_button
    on_press:
      then:
        - if:
            condition:
              lambda: 'return id(bell_address_a) != 0 && id(bell_address_b) != 0 && id(bell_address_c) != 0 && id(bell_address_d) != 0 && id(bell_address_e) != 0;'
            then:
              - logger.log: "Cannot add doorbell: all 5 slots are used"
            else:
              - lambda: 'id(learn_active) = true;'
              - logger.log: "Learn mode ON: press a doorbell button"
    web_server:
      sorting_group_id: doorbell_control
      sorting_weight: 50

  - platform: template
    name: "Clear all doorbell bindings"
    id: clear_doorbell_bindings
    on_press:
      then:
        - lambda: |-
            id(bell_address_a) = 0;
            id(bell_address_b) = 0;
            id(bell_address_c) = 0;
            id(bell_address_d) = 0;
            id(bell_address_e) = 0;
            id(learn_active) = false;

            id(doorbell_a).publish_state(false);
            id(doorbell_b).publish_state(false);
            id(doorbell_c).publish_state(false);
            id(doorbell_d).publish_state(false);
            id(doorbell_e).publish_state(false);

            id(bound_buttons_count).publish_state(0);
        - logger.log: "All doorbell bindings cleared"
    web_server:
      sorting_group_id: doorbell_control
      sorting_weight: 60

switch:
  - platform: template
    name: "Mute"
    id: mute_switch
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - light.turn_on: orange_light
      - logger.log: "Mute ON"
    turn_off_action:
      - light.turn_off: orange_light
      - logger.log: "Mute OFF"
    web_server:
      sorting_group_id: doorbell_control
      sorting_weight: 40

globals:
  # 0 means "slot is not bound".
  - id: bell_address_a
    type: uint32_t
    restore_value: true
    initial_value: '0'

  - id: bell_address_b
    type: uint32_t
    restore_value: true
    initial_value: '0'

  - id: bell_address_c
    type: uint32_t
    restore_value: true
    initial_value: '0'

  - id: bell_address_d
    type: uint32_t
    restore_value: true
    initial_value: '0'

  - id: bell_address_e
    type: uint32_t
    restore_value: true
    initial_value: '0'

  - id: learn_active
    type: bool
    restore_value: false
    initial_value: 'false'

script:
  - id: doorbell_pressed
    mode: restart
    parameters:
      slot: int
    then:
      - remote_transmitter.transmit_szy8039b:
          tune: !lambda 'return (int) id(tune_slider).state;'
          volume: !lambda 'return (int) id(volume_slider).state;'
          mode: !lambda 'return id(mute_switch).state ? 3 : 1;'

      - homeassistant.event:
          event: esphome.button_pressed
          data:
            type: Doorbell
            button: !lambda 'return "doorbell_" + to_string(slot);'

      - light.turn_on:
          id: blue_light
          effect: blink

      - delay: 5s
      - light.turn_off: blue_light

  - id: reset_doorbell_a
    mode: restart
    then:
      - delay: 300ms
      - lambda: 'id(doorbell_a).publish_state(false);'

  - id: reset_doorbell_b
    mode: restart
    then:
      - delay: 300ms
      - lambda: 'id(doorbell_b).publish_state(false);'

  - id: reset_doorbell_c
    mode: restart
    then:
      - delay: 300ms
      - lambda: 'id(doorbell_c).publish_state(false);'

  - id: reset_doorbell_d
    mode: restart
    then:
      - delay: 300ms
      - lambda: 'id(doorbell_d).publish_state(false);'

  - id: reset_doorbell_e
    mode: restart
    then:
      - delay: 300ms
      - lambda: 'id(doorbell_e).publish_state(false);'

sensor:
  - platform: template
    name: "Bound doorbell buttons"
    id: bound_buttons_count
    accuracy_decimals: 0
    lambda: |-
      int count = 0;

      if (id(bell_address_a) != 0) count++;
      if (id(bell_address_b) != 0) count++;
      if (id(bell_address_c) != 0) count++;
      if (id(bell_address_d) != 0) count++;
      if (id(bell_address_e) != 0) count++;

      return count;
    update_interval: 60s
    web_server:
      sorting_group_id: doorbell_sensors
      sorting_weight: 100

text_sensor:
  - platform: template
    name: "Last button address"
    internal: true
    id: last_button_address
    icon: mdi:remote

  - platform: template
    name: "Bound doorbell buttons"
    internal: true
    id: bound_buttons_summary
    icon: mdi:bell-ring
    lambda: |-
      if (id(bell_address_a) == 0 &&
          id(bell_address_b) == 0 &&
          id(bell_address_c) == 0 &&
          id(bell_address_d) == 0 &&
          id(bell_address_e) == 0) {
        return {"None"};
      }

      std::string out;
      char buf[24];

      if (id(bell_address_a) != 0) {
        snprintf(buf, sizeof(buf), "A=0x%06" PRIx32 " ", id(bell_address_a));
        out += buf;
      }
      if (id(bell_address_b) != 0) {
        snprintf(buf, sizeof(buf), "B=0x%06" PRIx32 " ", id(bell_address_b));
        out += buf;
      }
      if (id(bell_address_c) != 0) {
        snprintf(buf, sizeof(buf), "C=0x%06" PRIx32 " ", id(bell_address_c));
        out += buf;
      }
      if (id(bell_address_d) != 0) {
        snprintf(buf, sizeof(buf), "D=0x%06" PRIx32 " ", id(bell_address_d));
        out += buf;
      }
      if (id(bell_address_e) != 0) {
        snprintf(buf, sizeof(buf), "E=0x%06" PRIx32 " ", id(bell_address_e));
        out += buf;
      }

      return {out};
    update_interval: 60s
